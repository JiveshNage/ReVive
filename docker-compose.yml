version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: revive-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ReVive
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/revive
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=revive-prod-secret-key-change-in-env-file
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - revive-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: revive-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - revive-net

  postgres:
    image: postgres:16-alpine
    container_name: revive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - revive-net

  redis:
    image: redis:7-alpine
    container_name: revive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - revive-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: revive-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@revive.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - revive-net

volumes:
  postgres_data:

networks:
  revive-net:
    driver: bridge
